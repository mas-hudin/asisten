<!DOCTYPE html>
<html>
<head><title>Extract Audio</title></head>
<body>
<h1>Extracting Audio...</h1>
<div id="status">Loading...</div>
<a id="downloadLink" style="display:none; font-size: 20px; color: blue;">Download siska_voice_sample.wav</a>
<script>
async function extract() {
  const status = document.getElementById('status');
  try {
    status.textContent = 'Fetching video file...';
    const res = await fetch('../assets/gemini_generated_video_45dea1c5.mp4');
    const buf = await res.arrayBuffer();
    status.textContent = 'Decoding audio... (' + buf.byteLength + ' bytes)';
    
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuf = await audioCtx.decodeAudioData(buf);
    
    status.textContent = 'Encoding WAV: ' + audioBuf.duration.toFixed(2) + 's, ' + audioBuf.numberOfChannels + 'ch, ' + audioBuf.sampleRate + 'Hz';
    
    const wavBlob = audioBufferToWav(audioBuf);
    const url = URL.createObjectURL(wavBlob);
    
    const link = document.getElementById('downloadLink');
    link.href = url;
    link.download = 'siska_voice_sample.wav';
    link.style.display = 'block';
    link.textContent = 'Klik di sini untuk unduh siska_voice_sample.wav (' + Math.round(wavBlob.size/1024) + ' KB)';
    
    // Auto download
    link.click();
    status.textContent = 'Audio berhasil diekstrak! ' + Math.round(wavBlob.size/1024) + ' KB';
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
  }
}

function audioBufferToWav(buffer) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const format = 1; // PCM
  const bitDepth = 16;
  
  let interleaved;
  if (numChannels === 2) {
    const left = buffer.getChannelData(0);
    const right = buffer.getChannelData(1);
    interleaved = new Float32Array(left.length + right.length);
    for (let src = 0, dst = 0; src < left.length; src++, dst += 2) {
      interleaved[dst] = left[src];
      interleaved[dst + 1] = right[src];
    }
  } else {
    interleaved = buffer.getChannelData(0);
  }
  
  const bytesPerSample = bitDepth / 8;
  const blockAlign = numChannels * bytesPerSample;
  const dataByteCount = interleaved.length * bytesPerSample;
  const wavBuffer = new ArrayBuffer(44 + dataByteCount);
  const view = new DataView(wavBuffer);
  
  function writeString(offset, string) {
    for (let i = 0; i < string.length; i++) {
      view.setUint8(offset + i, string.charCodeAt(i));
    }
  }
  
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataByteCount, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, format, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitDepth, true);
  writeString(36, 'data');
  view.setUint32(40, dataByteCount, true);
  
  let offset = 44;
  for (let i = 0; i < interleaved.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, interleaved[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  
  return new Blob([view], { type: 'audio/wav' });
}

window.onload = extract;
</script>
</body>
</html>
